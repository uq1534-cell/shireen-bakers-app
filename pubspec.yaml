name: shireen_bakers
description: Shireen Bakers mobile app - Rawalpindi
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Image carousel (home slider)
  carousel_slider: ^4.2.1

  # Cached network images
  cached_network_image: ^3.3.1

  # Google Maps (store locator)
  google_maps_flutter: ^2.5.0

  # HTTP requests (when you add an API)
  http: ^1.2.0

  # Local storage (cart persistence)
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/